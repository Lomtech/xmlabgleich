# Prüft den Kern und stellt sicher, dass die veröffentlichte Datei zum Stand
# des Quelltextes passt.
#
# Verglichen wird der **Quelltexthash**, nicht die Datei selbst: Rust-Übersetzungen
# sind über verschiedene Werkzeugversionen hinweg nicht byteweise gleich — dasselbe
# Modul war unter macOS 224.495 und unter Linux 223.309 Byte groß. Ein Prüflauf auf
# Byte-Identität schlägt deshalb immer fehl, egal ob etwas vergessen wurde oder
# nicht. Was tatsächlich schiefgehen kann, ist etwas anderes: jemand ändert den
# Quelltext und liefert die gebaute Datei nicht mit. Genau das findet der Hash.
name: prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfungen
        run: cargo test --manifest-path kern/Cargo.toml

      - name: Passt index.html zum Quelltext?
        run: |
          # Zeichengleich zu bauen.sh — insbesondere LC_ALL=C, sonst
          # unterscheidet sich die Glob-Reihenfolge zwischen macOS und Linux
          # und derselbe Quelltext ergibt zwei Hashes.
          erwartet=$(find kern/src -name '*.rs' | LC_ALL=C sort | xargs cat |
              cat - kern/Cargo.toml kern/Cargo.lock web/vorlage.html bauen.sh |
              sha256sum | cut -c1-16)
          gefunden=$(grep -o 'name="quelltext" content="[0-9a-f]*"' index.html | grep -o '[0-9a-f]\{16\}' || true)
          echo "  Quelltext:     $erwartet"
          echo "  in index.html: ${gefunden:-— fehlt —}"
          if [ "$erwartet" != "$gefunden" ]; then
            echo "index.html stammt aus einem anderen Stand — bitte ./bauen.sh laufen lassen und mitliefern."
            exit 1
          fi

      - name: Sind beide Auslieferungen gleich?
        run: |
          # index.html und xmlabgleich.html sind dieselbe Datei unter zwei
          # Namen. Geprüft wurde bisher nur die eine — die andere hätte
          # unbemerkt veralten können.
          cmp index.html xmlabgleich.html

      - name: Ist das eingebettete Modul lauffähig?
        run: |
          # Kein Byte-Vergleich, aber die Gewissheit, dass überhaupt ein
          # gültiges WASM-Modul in der Datei steckt.
          python3 - <<'PY'
          import base64, pathlib, re, sys
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'WASM_BASE64 = "([A-Za-z0-9+/=]+)"', html)
          if not m:
              sys.exit("kein eingebettetes Modul gefunden")
          roh = base64.b64decode(m.group(1))
          if roh[:4] != b"\x00asm":
              sys.exit("das eingebettete Modul ist kein WebAssembly")
          print(f"  eingebettetes Modul: {len(roh)} Byte, gültige Kennung")
          PY
