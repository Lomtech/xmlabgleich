<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xmlabgleich</title>
<style>
:root {
  --grund: #ffffff; --text: #16181d; --gedaempft: #6b7280;
  --rand: #e5e7eb; --feld: #f9fafb;
  --gut: #15803d; --schlecht: #b91c1c; --warnung: #a16207; --betont: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --grund: #0f1115; --text: #e8eaed; --gedaempft: #9aa0a6;
    --rand: #2a2f3a; --feld: #171a21;
    --gut: #4ade80; --schlecht: #f87171; --warnung: #fbbf24; --betont: #60a5fa;
  }
}
* { box-sizing: border-box }
body {
  margin: 0; padding: 2rem 1.25rem 4rem;
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--grund); color: var(--text);
}
.mitte { max-width: 1000px; margin: 0 auto }
h1 { font-size: 1.5rem; margin: 0 0 .25rem }
h2 { font-size: 1.05rem; margin: 2rem 0 .75rem }
.unter { color: var(--gedaempft); margin: 0 0 1.75rem; max-width: 62ch }
.karte { border: 1px solid var(--rand); border-radius: 10px; padding: 1rem; margin-bottom: 1rem }
.paar { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem }
@media (max-width: 720px) { .paar { grid-template-columns: 1fr } }
.ablage {
  border: 2px dashed var(--rand); border-radius: 10px; padding: 1.25rem;
  text-align: center; transition: border-color .15s;
}
.ablage.drueber { border-color: var(--betont) }
.ablage .name { font-weight: 600; margin-top: .5rem; word-break: break-all }
.ablage .groesse { color: var(--gedaempft); font-size: .85rem }
button {
  font: inherit; padding: .45rem .9rem; border-radius: 7px;
  border: 1px solid var(--rand); background: var(--feld); color: var(--text); cursor: pointer;
}
button.haupt { background: var(--betont); border-color: var(--betont); color: #fff; font-weight: 600 }
button:disabled { opacity: .45; cursor: not-allowed }
input[type=file] { display: none }
input[type=text], select {
  font: inherit; padding: .4rem .6rem; border-radius: 7px;
  border: 1px solid var(--rand); background: var(--feld); color: var(--text); width: 100%;
}
.reihe { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap }
.balken { height: 5px; background: var(--rand); border-radius: 3px; overflow: hidden; margin-top: .75rem }
.balken > div { height: 100%; background: var(--betont); width: 0; transition: width .15s }
table { width: 100%; border-collapse: collapse; font-size: .9rem }
th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--rand) }
th { color: var(--gedaempft); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em }
td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums }
.rahmen { overflow-x: auto; border: 1px solid var(--rand); border-radius: 10px }
.urteil { padding: 1rem 1.25rem; border-radius: 10px; font-weight: 600; display: flex; gap: .75rem; align-items: center }
.urteil.gut { background: color-mix(in srgb, var(--gut) 12%, transparent); color: var(--gut) }
.urteil.schlecht { background: color-mix(in srgb, var(--schlecht) 12%, transparent); color: var(--schlecht) }
.urteil.warnung { background: color-mix(in srgb, var(--warnung) 14%, transparent); color: var(--warnung) }
.urteil .zeichen { font-size: 1.5rem }
.urteil .text { font-weight: 400; color: var(--text) }
.marke { display: inline-block; padding: .1rem .45rem; border-radius: 5px; font-size: .78rem; font-weight: 600 }
.marke.gut { background: color-mix(in srgb, var(--gut) 18%, transparent); color: var(--gut) }
.marke.schlecht { background: color-mix(in srgb, var(--schlecht) 18%, transparent); color: var(--schlecht) }
.marke.warnung { background: color-mix(in srgb, var(--warnung) 18%, transparent); color: var(--warnung) }
code, .pfad { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .87em }
.hinweis { color: var(--gedaempft); font-size: .87rem }
.verborgen { display: none }
ul.grenzen { color: var(--gedaempft); font-size: .88rem; padding-left: 1.1rem; margin: .5rem 0 0 }
ul.grenzen li { margin: .25rem 0 }
mark {
  background: color-mix(in srgb, var(--schlecht) 28%, transparent);
  color: inherit; border-radius: 3px; padding: 0 .12em; font-weight: 700;
}
button.mini {
  font-size: .8rem; padding: .2rem .5rem; border-radius: 5px;
  border: 1px solid var(--rand); background: transparent; color: var(--gedaempft);
}
button.mini:hover { color: var(--text); border-color: var(--betont) }
th.sortierbar { cursor: pointer; user-select: none }
th.sortierbar:hover { color: var(--betont) }
.datentabelle { margin-bottom: 1rem }
.blaettern { display: flex; gap: .25rem; align-items: center }
.blaettern button {
  font-size: .9rem; padding: .2rem .5rem; border-radius: 5px; min-width: 2rem;
  border: 1px solid var(--rand); background: transparent; color: var(--gedaempft);
}
.blaettern button:hover { color: var(--text); border-color: var(--betont) }
.springen {
  font: inherit; font-size: .8rem; padding: .2rem .4rem; border-radius: 5px;
  border: 1px solid var(--rand); background: var(--feld); color: var(--text);
}
td.lfd, th.lfd {
  color: var(--gedaempft); font-size: .78rem; text-align: right;
  font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap;
}
.loading::after { content: " …"; animation: punkte 1.2s infinite }
@keyframes punkte { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
</style>
</head>
<body>
<div class="mitte">

  <h1>xmlabgleich</h1>
  <p class="unter">
    Vergleicht zwei XML-Dateien beliebiger Größe und zeigt, welches Feld in welchem
    Datensatz abweicht. Die Dateien werden im Browser gelesen und verlassen diesen
    Rechner nicht.
  </p>

  <div class="paar">
    <div class="ablage" id="ablage-a">
      <button type="button" class="knopf" data-waehlen="a">Quelle wählen</button>
      <input type="file" id="datei-a" accept=".xml,text/xml,application/xml">
      <div class="name" id="name-a"></div>
      <div class="groesse" id="groesse-a">oder Datei hierher ziehen</div>
    </div>
    <div class="ablage" id="ablage-b">
      <button type="button" class="knopf" data-waehlen="b">Ziel wählen</button>
      <input type="file" id="datei-b" accept=".xml,text/xml,application/xml">
      <div class="name" id="name-b"></div>
      <div class="groesse" id="groesse-b">oder Datei hierher ziehen</div>
    </div>
  </div>

  <div class="karte verborgen" id="aufbau">
    <h2 style="margin-top:0">Aufbau</h2>
    <p class="hinweis" id="erkundet"></p>
    <div class="reihe" style="margin-top:.75rem">
      <div style="flex:1;min-width:260px">
        <div class="hinweis">Datensatz-Element</div>
        <input type="text" id="datensatz" spellcheck="false" autocomplete="off">
      </div>
      <div style="flex:1;min-width:220px">
        <div class="hinweis">Schlüsselfeld (im Datensatz)</div>
        <select id="schluessel"></select>
      </div>
    </div>
    <p class="hinweis" id="schluessel-hinweis" style="margin-top:.6rem"></p>
    <p class="hinweis" id="untertabellen" style="margin-top:.35rem"></p>
    <div class="reihe" style="margin-top:1rem">
      <button class="haupt" id="starten">Abgleichen</button>
      <span class="hinweis" id="fortschritt-text"></span>
    </div>
    <div class="balken verborgen" id="balken"><div id="fuell"></div></div>
  </div>

  <div id="ergebnis"></div>

</div>

<script>
"use strict";

/* Das WASM-Modul steckt als Base64 in dieser Datei. Deshalb läuft sie auch
   per Doppelklick von der Festplatte — ohne Server, ohne Installation, und
   ohne dass irgendetwas ins Netz geht. */
const WASM_BASE64 = "%%WASM%%";

const $ = id => document.getElementById(id);
const zahl = n => (n ?? 0).toLocaleString("de-DE");
/** „1 Datensatz" statt „1 Datensätze". */
const saetze = n => `${zahl(n)} ${n === 1 ? "Datensatz" : "Datensätze"}`;

/** Beugt mit — ein Bericht, der „1 Datensätze" schreibt, wird nicht ernst genommen. */
const viele = (n, einzahl, mehrzahl) => `${zahl(n)} ${n === 1 ? einzahl : mehrzahl}`;
const groesse = b => {
  const e = ["B", "kB", "MB", "GB", "TB"];
  let v = b, i = 0;
  while (v >= 1000 && i < e.length - 1) { v /= 1000; i++ }
  return i === 0 ? `${b} B` : `${v.toFixed(1)} ${e[i]}`;
};

let modul = null;
const dateien = { a: null, b: null };
let erkundung = null;
let untertabellen = [];   // Wiederholgruppen aus der Erkundung

async function ladeModul() {
  if (modul) return modul;
  const roh = Uint8Array.from(atob(WASM_BASE64), c => c.charCodeAt(0));
  const { instance } = await WebAssembly.instantiate(roh, {});
  modul = instance.exports;
  return modul;
}

/**
 * Liest das Ergebnis-JSON aus dem Ausgabepuffer.
 *
 * Der Kern antwortet mit `{fehler: …}`, wenn er die Datei nicht auswerten
 * kann. Das wurde hier bisher nicht abgefragt — das Ergebnis wäre dann ein
 * Bericht voller `undefined` gewesen, der aussieht wie ein Befund. Lieber
 * abbrechen und sagen, was los ist.
 */
function ergebnisLesen(w) {
  const len = w.ausgabe_len();
  const roh = new Uint8Array(w.memory.buffer, w.ausgabe_ptr(), len);
  const e = JSON.parse(new TextDecoder().decode(roh));
  if (e && e.fehler) throw new KernFehler(e.fehler);
  return e;
}

/** Ein Abbruch aus dem Kern, mit einer für Menschen lesbaren Erklärung. */
class KernFehler extends Error {
  constructor(art) {
    super(KernFehler.text(art));
    this.art = art;
  }
  static text(art) {
    if (art === "nicht-utf8") {
      return "Die Datei ist nicht UTF-8, sondern UTF-16 (erkennbar an den "
        + "Nullbytes zwischen den Zeichen). So gelesen ergäbe der Abgleich "
        + "Unsinn, deshalb bricht er hier ab. Speichern Sie die Datei als "
        + "UTF-8 und versuchen Sie es erneut.";
    }
    if (art === "nicht begonnen") {
      return "Der Kern wurde in falscher Reihenfolge angesprochen — bitte die "
        + "Seite neu laden.";
    }
    return `Der Kern meldet: ${art}`;
  }
}

/**
 * Schiebt eine Datei blockweise durch das Modul.
 *
 * Der Speicher des Moduls kann durch das Wachsen umziehen, deshalb wird die
 * Sicht darauf bei jedem Block neu geholt — sonst schreibt man irgendwann in
 * einen verwaisten Puffer.
 */
async function durchschieben(w, datei, blockAufrufen, melden) {
  const max = w.puffer_groesse();
  const leser = datei.stream().getReader();
  let rest = new Uint8Array(0), gelesen = 0;

  for (;;) {
    const { done, value } = await leser.read();
    if (done) break;
    gelesen += value.length;

    let block;
    if (rest.length) {
      block = new Uint8Array(rest.length + value.length);
      block.set(rest); block.set(value, rest.length);
    } else block = value;

    let ab = 0;
    while (block.length - ab >= max) {
      new Uint8Array(w.memory.buffer, w.puffer_ptr(), max).set(block.subarray(ab, ab + max));
      blockAufrufen(max);
      ab += max;
    }
    rest = block.subarray(ab);

    if (rest.length) {
      new Uint8Array(w.memory.buffer, w.puffer_ptr(), rest.length).set(rest);
      blockAufrufen(rest.length);
      rest = new Uint8Array(0);
    }
    if (melden) melden(gelesen, datei.size);
  }
}

/* ─────────────────────────────────────────── Dateiauswahl */

function ablageEinrichten(seite) {
  const ablage = $("ablage-" + seite);
  const eingabe = $("datei-" + seite);

  eingabe.addEventListener("change", () => {
    if (eingabe.files[0]) uebernehmen(seite, eingabe.files[0]);
  });
  ablage.addEventListener("dragover", e => { e.preventDefault(); ablage.classList.add("drueber") });
  ablage.addEventListener("dragleave", () => ablage.classList.remove("drueber"));
  ablage.addEventListener("drop", e => {
    e.preventDefault();
    ablage.classList.remove("drueber");
    const d = e.dataTransfer.files[0];
    if (d) uebernehmen(seite, d);
  });
}

async function uebernehmen(seite, datei) {
  dateien[seite] = datei;
  $("name-" + seite).textContent = datei.name;
  $("groesse-" + seite).textContent = groesse(datei.size);
  $("ergebnis").innerHTML = "";

  // Der Aufbau wird an der Quelle erkundet, sobald sie da ist. Bricht der
  // Kern ab, muss das hier stehen — sonst bliebe „Aufbau wird gelesen …"
  // stehen und niemand wüsste warum.
  if (seite === "a") {
    try {
      await erkunden(datei);
    } catch (e) {
      if (!(e instanceof KernFehler)) throw e;
      $("erkundet").textContent = "";
      $("ergebnis").innerHTML = `<div class="karte">
        <span class="marke schlecht">nicht lesbar</span> ${escape(e.message)}</div>`;
      $("starten").disabled = true;
      return;
    }
  }
  $("starten").disabled = !(dateien.a && dateien.b);
}

async function erkunden(datei) {
  const w = await ladeModul();
  $("aufbau").classList.remove("verborgen");
  $("erkundet").textContent = "Aufbau wird gelesen …";
  $("starten").disabled = true;

  const t0 = performance.now();
  w.erkundung_start();
  await durchschieben(w, datei, len => w.erkundung_block(len));
  w.erkundung_fertig();
  erkundung = ergebnisLesen(w);

  const s = ((performance.now() - t0) / 1000).toFixed(1);
  $("erkundet").textContent =
    `${zahl(erkundung.elemente)} Elemente, ${zahl(erkundung.pfadeGesamt)} verschiedene Pfade — in ${s}s gelesen.`;

  $("datensatz").value = erkundung.datensatz || "";
  untertabellen = (erkundung.untertabellen ?? []).map(u => u.pfad);
  $("untertabellen").textContent = untertabellen.length
    ? `${viele(untertabellen.length, "Wiederholgruppe wird", "Wiederholgruppen werden")} als eigene Tabelle behandelt: `
      + untertabellen.slice(0, 6).join(", ") + (untertabellen.length > 6 ? " …" : "")
    : "Keine Wiederholgruppen — der Datensatz ist flach.";

  const wahl = $("schluessel");
  wahl.innerHTML = "";
  const k = erkundung.schluesselKandidaten || [];
  if (!k.length) {
    wahl.innerHTML = '<option value="">— kein Feld gefunden —</option>';
    $("schluessel-hinweis").textContent =
      "Kein Feld kommt in jedem Datensatz genau einmal vor. Ohne Schlüssel bleibt nur die Spaltenachse.";
  } else {
    // Bei einem einzigen Datensatz ist jedes Feld rechnerisch eindeutig.
    // Ein Häkchen behauptete dort eine Sicherheit, die die Zahl nicht deckt.
    const beurteilbar = (erkundung.datensaetze ?? 0) > 1;
    for (const kand of k) {
      const o = document.createElement("option");
      o.value = kand.feld;
      const gut = kand.verschieden >= erkundung.datensaetze;
      o.textContent = `${beurteilbar ? (gut ? "✓" : "✗") : "?"} ${kand.feld} — ${zahl(kand.verschieden)} verschiedene Werte`;
      wahl.append(o);
    }
    // Der Hinweis muss dem gewählten Feld folgen, nicht dem bestplatzierten:
    // Sonst steht unter einer schlechten Wahl weiter die gute Auskunft.
    const zeigeGuete = () => {
      const kand = k.find(x => x.feld === wahl.value) ?? k[0];
      const eindeutig = kand.verschieden >= erkundung.datensaetze;
      const h = $("schluessel-hinweis");
      if (!beurteilbar) {
        h.style.color = "";
        h.textContent = `Die Datei enthält nur ${zahl(erkundung.datensaetze)} Datensatz — `
          + `damit lässt sich nicht messen, ob ${kand.feld} ihn eindeutig benennt. `
          + `Wählen Sie ein Feld, das die Identität trägt (eine Kennung), keine `
          + `Eigenschaft, die sich zwischen den Ständen ändern kann: Ändert sich der `
          + `Schlüssel selbst, gilt der Datensatz als verschwunden statt als geändert.`;
        return;
      }
      h.style.color = eindeutig ? "" : "var(--schlecht)";
      h.textContent = eindeutig
        ? `${kand.feld} ist eindeutig: ${zahl(kand.verschieden)} verschiedene Werte bei ${zahl(erkundung.datensaetze)} Datensätzen.`
        : `${kand.feld} taugt nicht als Schlüssel: nur ${zahl(kand.verschieden)} verschiedene Werte bei ${zahl(erkundung.datensaetze)} Datensätzen. Mehrere Datensätze fallen zusammen, der Abgleich sagt dann nichts aus.`;
    };
    wahl.onchange = () => { zeigeGuete(); standSpeichern(); };
    zeigeGuete();
  }
  $("starten").disabled = !(dateien.a && dateien.b);
  standSpeichern();
}

/* ─────────────────────────────────────────── Abgleich */

const EIMER = 4096;

async function abdruckVon(w, datei, konfig, melden, untertabellen = []) {
  const roh = new TextEncoder().encode(konfig);
  new Uint8Array(w.memory.buffer, w.puffer_ptr(), roh.length).set(roh);
  w.zerlegung_vorbereiten(roh.length, EIMER);
  // Jede Wiederholgruppe wird eine eigene Tabelle. Ohne diese Anmeldung
  // bliebe alles flach, und ein Tausch innerhalb einer Gruppe unsichtbar.
  for (const u of untertabellen) {
    const b = new TextEncoder().encode(u);
    new Uint8Array(w.memory.buffer, w.puffer_ptr(), b.length).set(b);
    w.zerlegung_untertabelle(b.length);
  }
  w.zerlegung_start();
  await durchschieben(w, datei, len => w.zerlegung_block(len), melden);
  w.zerlegung_fertig();
  return ergebnisLesen(w);
}

/** Bequemer Zugriff: eine Tabelle nach Namen. */
function tabelle(abdruck, name) {
  return (abdruck.tabellen ?? []).find(t => t.name === name);
}
function hauptTabelle(abdruck) {
  return tabelle(abdruck, "") ?? { spalten: [], eimer: [], zeilen: 0, felder: 0 };
}

$("starten").addEventListener("click", async () => {
  const w = await ladeModul();
  const datensatz = $("datensatz").value.trim();
  const schluessel = $("schluessel").value;
  if (!datensatz) { alert("Bitte das Datensatz-Element angeben."); return }

  const konfig = schluessel ? `${datensatz}\n${schluessel}` : datensatz;
  $("starten").disabled = true;
  $("balken").classList.remove("verborgen");
  $("ergebnis").innerHTML = "";
  try {

  const t0 = performance.now();
  const melden = (name, anteilBasis) => (gelesen, gesamt) => {
    const anteil = (anteilBasis + (gelesen / gesamt) * 50);
    $("fuell").style.width = anteil + "%";
    $("fortschritt-text").textContent = `${name}: ${groesse(gelesen)} von ${groesse(gesamt)}`;
  };

  const a = await abdruckVon(w, dateien.a, konfig, melden("Quelle", 0), untertabellen);
  const b = await abdruckVon(w, dateien.b, konfig, melden("Ziel", 50), untertabellen);

  const dauer = (performance.now() - t0) / 1000;
  const bytes = dateien.a.size + dateien.b.size;
  $("fortschritt-text").textContent =
    `${groesse(bytes)} in ${dauer.toFixed(1)}s (${groesse(bytes / dauer)}/s)`;
  $("balken").classList.add("verborgen");
  $("starten").disabled = false;

  const e = vergleiche(a, b);
  e.schluesselFeld = schluessel;
  zeigeBericht(e, datensatz, schluessel);
  standSpeichern({ bericht: e });

  // Zweiter Durchlauf: die konkreten Werte hinter den Abweichungen.
  //
  // Der Abdruck selbst ist datenfrei, damit er einen Betrieb verlassen darf.
  // Hier liegen aber beide Dateien auf demselben Rechner — es wandert nichts,
  // und die einzige Frage, die zählt, lautet: was steht da anders? Der erste
  // Durchlauf hat die Suche bereits auf wenige Datensätze eingegrenzt.
  // Der Nachlauf holt die einzelnen Werte. Er läuft, wenn es etwas
  // nachzulesen gibt — ohne Abwägung, ob es sich lohnt: Das zu entscheiden
  // ist nicht Sache des Werkzeugs.
  if (!e.bestanden && schluessel && e.spalten.some(s => s.art === "abweichend")) {
    const gefunden = await zeigeEinzelheiten(w, e, konfig);
    // Jetzt sind auch die einzelnen Werte da — die Befundliste bekommt sie.
    zeigeBefunde(e, gefunden ?? null);
    standSpeichern({ bericht: e, einzelheiten: gefunden ?? null });
  }
  } catch (e) {
    if (!(e instanceof KernFehler)) throw e;
    $("ergebnis").innerHTML = `<div class="karte">
      <span class="marke schlecht">abgebrochen</span> ${escape(e.message)}</div>`;
  } finally {
    $("balken").classList.add("verborgen");
    $("starten").disabled = false;
  }
});

/** Holt die Klartextwerte der abweichenden Stellen aus beiden Dateien. */
async function einzelheitenVon(w, datei, konfig, eimer, pfade, tab) {
  const schreibe = (text) => {
    const b = new TextEncoder().encode(text);
    new Uint8Array(w.memory.buffer, w.puffer_ptr(), b.length).set(b);
    return b.length;
  };
  w.einzelheiten_vorbereiten(schreibe(konfig), EIMER);
  // Dieselbe Zerlegung wie beim ersten Durchlauf — sonst zeigt der zweite auf
  // andere Zeilen.
  for (const u of untertabellen) w.zerlegung_untertabelle(schreibe(u));
  w.einzelheiten_tabelle(schreibe(tab ?? ""));
  for (const nr of eimer) w.einzelheiten_eimer(nr);
  for (const p of pfade) w.einzelheiten_pfad(schreibe(p));
  w.einzelheiten_start();
  await durchschieben(w, datei, len => w.einzelheiten_block(len));
  w.einzelheiten_fertig();
  return ergebnisLesen(w);
}

async function zeigeEinzelheiten(w, e, konfig) {
  // Liefert die gefundenen Unterschiede zurück — sie gehören in den
  // gemerkten Stand, sonst fehlt nach einem Neuladen genau die Angabe,
  // wegen der man den Bericht aufschlägt.
  const ziel = $("werte-platz") ?? $("ergebnis").appendChild(document.createElement("div"));
  ziel.innerHTML = `<h3 style="margin:1.2rem 0 .5rem;font-size:.95rem">Welche Werte genau?</h3>
    <div class="karte hinweis"><span class="loading">Die betroffenen Datensätze werden gelesen</span></div>`;

  // Je betroffener Tabelle ein gezielter Nachlauf — nur die abweichenden
  // Eimer und Felder, sonst läse man die Datei vollständig ein zweites Mal.
  const betroffen = (e.tabellen ?? []).filter(tb =>
    tb.spalten.some(s => s.art === "abweichend") && tb.eimer.length);
  if (!betroffen.length) { ziel.remove(); return }

  const gegenueber = new Map();
  let gekuerzt = false;
  let gruppen = 0;

  for (const [nr, tb] of betroffen.slice(0, 8).entries()) {
    const eimer = tb.eimer.map(g => g.nr);
    const pfade = tb.spalten.filter(s => s.art === "abweichend").map(s => s.pfad);
    gruppen += eimer.length;
    // Der Nachlauf liest beide Dateien je Tabelle erneut; bei großen Dateien
    // dauert das, und ein stummer Ladepunkt sieht aus wie ein Hänger.
    ziel.querySelector(".loading").textContent =
      `${escape(tb.name || "Datensatz")} wird nachgelesen (${nr + 1} von ${Math.min(betroffen.length, 8)})`;
    await new Promise(r => setTimeout(r, 0));

    const [ea, eb] = [
      await einzelheitenVon(w, dateien.a, konfig, eimer, pfade, tb.name),
      await einzelheitenVon(w, dateien.b, konfig, eimer, pfade, tb.name),
    ];
    gekuerzt = gekuerzt || ea.abgeschnitten || eb.abgeschnitten;

    const eintragen = (funde, seite) => {
      for (const [schluessel, pfad, wert, tabName] of funde.funde ?? []) {
        const k = `${tabName}\u001f${schluessel}\u001f${pfad}`;
        if (!gegenueber.has(k)) gegenueber.set(k, { schluessel, pfad, tabelle: tabName });
        gegenueber.get(k)[seite] = wert;
      }
    };
    eintragen(ea, "a");
    eintragen(eb, "b");
  }

  const unterschiede = [...gegenueber.values()].filter(z => z.a !== z.b);

  if (!unterschiede.length) {
    ziel.innerHTML = `<h2>Welcher Wert?</h2>
      <div class="karte hinweis">Die betroffenen Datensätze ließen sich nicht auflösen —
      möglicherweise ist der Schlüssel nicht eindeutig.</div>`;
    return [];
  }

  const t = [`<h3 style="margin:1.2rem 0 .5rem;font-size:.95rem">Welche Werte genau?</h3>
    <div class="karte hinweis" style="margin-bottom:.75rem">
      ${viele(unterschiede.length, "Stelle unterscheidet", "Stellen unterscheiden")} sich —
      gefunden durch gezieltes Nachlesen ${gruppen === 1
        ? "der einen betroffenen Gruppe"
        : `der ${zahl(gruppen)} betroffenen Gruppen`}
      statt der ganzen Datei.
      ${gekuerzt ? "<b>Die Liste ist gekürzt.</b>" : ""}
    </div>`,
    datensatzUebersicht(unterschiede),
    datenTabelle("t-werte", [
      { kopf: "Schlüssel", wert: z => z.schluessel, klasse: "pfad" },
      { kopf: "Tabelle", wert: z => z.tabelle || "(Datensatz)" },
      { kopf: "Feld", wert: z => z.pfad, klasse: "pfad" },
      { kopf: "Quelle", csv: z => z.a ?? "", roh: true, wert: z => hervorheben(z.a, z.b) },
      { kopf: "Ziel", csv: z => z.b ?? "", roh: true, wert: z => hervorheben(z.b, z.a) },
    ], unterschiede, "4_werte.csv")];

  ziel.innerHTML = t.join("");
  tabellenZeichnen();
  return { unterschiede, gruppen, gekuerzt };
}

/** Zeichnet einen gemerkten Klartext-Nachlauf ohne erneutes Lesen. */
function zeigeGemerkteEinzelheiten(gemerkt, ziel) {
  if (!gemerkt?.unterschiede?.length) return;
  const t = [`<h3 style="margin:1.2rem 0 .5rem;font-size:.95rem">Welche Werte genau?</h3>
    <div class="karte hinweis" style="margin-bottom:.75rem">
      ${viele(gemerkt.unterschiede.length, "Stelle unterscheidet", "Stellen unterscheiden")} sich —
      ${gemerkt.gruppen === 1 ? "aus der einen betroffenen Gruppe" : `aus ${zahl(gemerkt.gruppen)} betroffenen Gruppen`}.
      ${gemerkt.gekuerzt ? "<b>Die Liste ist gekürzt.</b>" : ""}
    </div>`,
    datensatzUebersicht(gemerkt.unterschiede),
    datenTabelle("t-werte-gemerkt", [
      { kopf: "Schlüssel", wert: z => z.schluessel, klasse: "pfad" },
      { kopf: "Tabelle", wert: z => z.tabelle || "(Datensatz)" },
      { kopf: "Feld", wert: z => z.pfad, klasse: "pfad" },
      { kopf: "Quelle", csv: z => z.a ?? "", roh: true, wert: z => hervorheben(z.a, z.b) },
      { kopf: "Ziel", csv: z => z.b ?? "", roh: true, wert: z => hervorheben(z.b, z.a) },
    ], gemerkt.unterschiede, "4_werte.csv")];
  const platz = ziel.querySelector("#werte-platz");
  const kasten = platz ?? document.createElement("div");
  kasten.innerHTML = t.join("");
  if (!platz) ziel.append(kasten);
  tabellenZeichnen();
}

/**
 * Benennt die Datensätze, die auf einer Seite fehlen.
 *
 * Bei ungleicher Menge ist das die einzige Auskunft, die zählt: Wenn neun von
 * zehn Datensätzen fehlen, weicht zwangsläufig jedes Feld ab — diese Liste
 * abzuarbeiten führt nirgendwohin. Welche Sätze es sind, führt weiter.
 */
/**
 * Fasst zusammen, welche Datensätze betroffen sind.
 *
 * Der Schlüssel einer Untertabellenzeile trägt den Fremdschlüssel und eine
 * laufende Nummer (`A1#2`). Für diese Übersicht zählt nur der Datensatz
 * davor — sonst stünde derselbe Beleg dreimal da, weil drei seiner
 * Positionen abweichen.
 */
function datensatzUebersicht(unterschiede) {
  const je = new Map();
  for (const u of unterschiede) {
    const satz = String(u.schluessel).split("#")[0];
    je.set(satz, (je.get(satz) ?? 0) + 1);
  }
  if (je.size === 0) return "";
  const zeilen = [...je.entries()].map(([satz, n]) => ({ satz, n }))
    .sort((a, b) => b.n - a.n);

  return `<div class="karte" style="margin-bottom:.75rem">
      <b>${viele(zeilen.length, "Datensatz ist", "Datensätze sind")} betroffen.</b>
      ${zeilen.length <= 12
        ? " " + zeilen.map(z => `<code>${escape(z.satz)}</code>`).join(", ")
        : ""}
    </div>` +
    (zeilen.length > 12
      ? datenTabelle("t-saetze", [
          { kopf: "Datensatz", wert: z => z.satz, klasse: "pfad" },
          { kopf: "abweichende Stellen", wert: z => z.n, zahl: true, klasse: "zahl" },
        ], zeilen, "4_betroffene_datensaetze.csv")
      : "");
}

/** Letztes Pfadstück, der Rest gekürzt — die vollen Pfade sind sehr lang. */
function kurzerPfad(p) {
  const teile = String(p).split("/");
  return teile.length > 2 ? "…/" + teile.slice(-2).join("/") : p;
}

/**
 * Stellt die abweichenden Zeichen heraus. Bei einer vertauschten Ziffer in
 * einem langen Wert ist das der Unterschied zwischen „irgendwas ist anders"
 * und „hier".
 */
function hervorheben(wert, andere) {
  if (wert === undefined) return '<span class="hinweis">– fehlt –</span>';
  if (andere === undefined) return `<code>${escape(wert)}</code>`;
  const w = String(wert), a = String(andere);
  let vorn = 0;
  while (vorn < w.length && vorn < a.length && w[vorn] === a[vorn]) vorn++;
  let hinten = 0;
  while (hinten < w.length - vorn && hinten < a.length - vorn &&
         w[w.length - 1 - hinten] === a[a.length - 1 - hinten]) hinten++;
  const mitte = w.slice(vorn, w.length - hinten);
  return `<code>${escape(w.slice(0, vorn))}<mark>${escape(mitte) || "∅"}</mark>${escape(w.slice(w.length - hinten))}</code>`;
}

/* ─────────────────────────────────────────── Vergleich */

function vergleiche(a, b) {
  // Über alle Tabellen: Haupttabelle und jede Wiederholgruppe.
  const namenA = new Set((a.tabellen ?? []).map(t => t.name));
  const namenB = new Set((b.tabellen ?? []).map(t => t.name));
  const alleTabellen = [...new Set([...namenA, ...namenB])].sort();

  const tabellen = alleTabellen.map(name => {
    const ta = tabelle(a, name), tb = tabelle(b, name);
    const sa = new Map((ta?.spalten ?? []).map(s => [s[0], s]));
    const sb = new Map((tb?.spalten ?? []).map(s => [s[0], s]));
    const pfade = [...new Set([...sa.keys(), ...sb.keys()])].sort();

    const spalten = [];
    for (const p of pfade) {
      const x = sa.get(p), y = sb.get(p);
      if (!x) { spalten.push({ pfad: p, art: "nur-ziel", a: null, b: y }); continue }
      if (!y) { spalten.push({ pfad: p, art: "nur-quelle", a: x, b: null }); continue }
      if (x[1] !== y[1] || x[2] !== y[2]) spalten.push({ pfad: p, art: "abweichend", a: x, b: y });
    }
    const eimer = [];
    const n = Math.min(ta?.eimer?.length ?? 0, tb?.eimer?.length ?? 0);
    for (let i = 0; i < n; i++) {
      const x = ta.eimer[i], y = tb.eimer[i];
      if (x[0] !== y[0] || x[1] !== y[1] || x[2] !== y[2]) eimer.push({ nr: i, a: x, b: y });
    }
    return {
      name, ta, tb, spalten, eimer,
      zeilenGleich: (ta?.zeilen ?? 0) === (tb?.zeilen ?? 0),
      fehltIn: !ta ? "quelle" : !tb ? "ziel" : null,
    };
  });

  const ha = hauptTabelle(a), hb = hauptTabelle(b);
  const spaltenA = new Map((ha.spalten ?? []).map(s => [s[0], s]));
  const spaltenB = new Map((hb.spalten ?? []).map(s => [s[0], s]));
  const allePfade = [...new Set([...spaltenA.keys(), ...spaltenB.keys()])].sort();

  const spalten = [];
  for (const p of allePfade) {
    const x = spaltenA.get(p), y = spaltenB.get(p);
    if (!x) { spalten.push({ pfad: p, art: "nur-ziel", a: null, b: y }); continue }
    if (!y) { spalten.push({ pfad: p, art: "nur-quelle", a: x, b: null }); continue }
    if (x[1] !== y[1] || x[2] !== y[2]) spalten.push({ pfad: p, art: "abweichend", a: x, b: y });
  }

  const eimer = [];
  const n = Math.min((ha.eimer ?? []).length, (hb.eimer ?? []).length);
  for (let i = 0; i < n; i++) {
    const x = ha.eimer[i], y = hb.eimer[i];
    if (x[0] !== y[0] || x[1] !== y[1] || x[2] !== y[2]) eimer.push({ nr: i, a: x, b: y });
  }

  // Die Satzfolge zählt mit. Sie ist die einzige nicht kommutative Prüfung
  // hier — und ein Bestand, dessen Sätze anders sortiert sind, ist nicht
  // derselbe Bestand, auch wenn jeder einzelne Satz stimmt. Ob das im
  // konkreten Fall stört, entscheidet der Verarbeitungsweg, nicht dieses
  // Werkzeug; gemeldet wird es in jedem Fall.
  const folgeGleich = a.gesamt === b.gesamt
    ? true
    : JSON.stringify(a.ersteSchluessel) === JSON.stringify(b.ersteSchluessel);
  // Über alle Tabellen: Eine Abweichung in einer Wiederholgruppe zählt
  // genauso wie eine in der Haupttabelle.
  const werteGleich = tabellen.every(t => !t.spalten.length && !t.eimer.length && t.zeilenGleich)
    && a.datensaetze === b.datensaetze;

  // Zusammengefasst über alle Tabellen — die Abweichung kann in einer
  // Wiederholgruppe stecken, nicht nur im Datensatz selbst.
  const alleSpalten = tabellen.flatMap(tb => tb.spalten.map(s => ({ ...s, tabelle: tb.name })));
  const alleEimer = tabellen.flatMap(tb => tb.eimer.map(g => ({ ...g, tabelle: tb.name })));

  return {
    a, b, spalten: alleSpalten, eimer: alleEimer, tabellen,
    // Mitgeführt, damit der Bericht für sich steht: Nach einem Neuladen sind
    // die Dateien nicht mehr geöffnet, der gemerkte Bericht soll trotzdem
    // vollständig anzeigbar sein.
    dateiA: { name: dateien.a?.name ?? "Quelle", groesse: dateien.a?.size ?? null },
    dateiB: { name: dateien.b?.name ?? "Ziel", groesse: dateien.b?.size ?? null },
    datensaetzeGleich: a.datensaetze === b.datensaetze,
    folgeGleich,
    werteGleich,
    nurUmsortiert: werteGleich && !folgeGleich,
    bestanden: werteGleich && folgeGleich,
  };
}


/* ─────────────────────────────────── Tabellen mit Filter, Sortierung, Ausgabe
 *
 * Alle Abweichungslisten laufen über diese eine Stelle. Sie zeigt die Zeilen
 * vollständig — abgeschnittene Listen sind bei einem Prüfbericht das
 * Gegenteil dessen, wozu er da ist —, lässt filtern, sortieren und als CSV
 * ausgeben.
 *
 * Gerendert wird stückweise nachgeladen: Zehntausende Zeilen auf einmal in
 * den Baum zu hängen legt die Seite lahm, während die ersten hundert schon
 * die Frage beantworten.
 */
// Seitengröße wie im CSV-Betrachter: Es stehen immer nur so viele Zeilen im
// Baum, unabhängig davon, wie lang die Liste ist. Blättern statt Nachladen
// trägt Millionen Zeilen, weil der Browser nie mehr als eine Seite zeichnet.
const SEITE = 50;
const tabellenZustand = new Map();

function datenTabelle(id, spalten, zeilen, dateiname) {
  // Eine leere Liste braucht weder Kopf noch Filter noch Ausgabeknopf.
  if (!zeilen.length) return "";
  tabellenZustand.set(id, {
    spalten, zeilen, dateiname,
    filter: "", sortiert: null, absteigend: false, seite: 0,
  });
  return `<div class="datentabelle" id="${id}"></div>`;
}

/** Zahlen in Texten der Größe nach ordnen: „POS[2]" vor „POS[10]". */
const ordner = new Intl.Collator("de", { numeric: true, sensitivity: "base" });

function sichtbareZeilen(z) {
  // Ergebnis merken: Bei Hunderttausenden Zeilen darf nicht bei jedem
  // Blättern neu gefiltert und sortiert werden.
  const kennung = `${z.filter}\u001f${z.sortiert}\u001f${z.absteigend}`;
  if (z.gemerktFuer === kennung) return z.gemerkt;

  let zeilen = z.zeilen;
  if (z.filter) {
    const suche = z.filter.toLowerCase();
    zeilen = zeilen.filter(r =>
      z.spalten.some(s => String(s.csv ? s.csv(r) : s.wert(r) ?? "").toLowerCase().includes(suche)));
  }
  if (z.sortiert !== null) {
    const s = z.spalten[z.sortiert];
    const roh = r => (s.csv ? s.csv(r) : s.wert(r));
    zeilen = [...zeilen].sort((a, b) => {
      const x = roh(a), y = roh(b);
      const zx = Number(x), zy = Number(y);
      const cmp = (s.zahl && !isNaN(zx) && !isNaN(zy))
        ? zx - zy
        // Mit `numeric` — sonst steht „10" vor „9" und „POS[10]" vor
        // „POS[2]", also gerade in den Spalten falsch, nach denen man
        // sortiert.
        : ordner.compare(String(x ?? ""), String(y ?? ""));
      return z.absteigend ? -cmp : cmp;
    });
  }
  z.gemerktFuer = kennung;
  z.gemerkt = zeilen;
  return zeilen;
}

function zeichneTabelle(id) {
  const z = tabellenZustand.get(id);
  const behaelter = $(id);
  if (!z || !behaelter) return;

  const gefiltert = sichtbareZeilen(z);
  const maxSeite = Math.max(Math.ceil(gefiltert.length / SEITE) - 1, 0);
  z.seite = Math.min(Math.max(z.seite, 0), maxSeite);
  const von = z.seite * SEITE;
  const zeigen = gefiltert.slice(von, von + SEITE);

  const kopf = z.spalten.map((s, i) => {
    const pfeil = z.sortiert === i ? (z.absteigend ? " ↓" : " ↑") : "";
    return `<th class="${s.zahl ? "zahl " : ""}sortierbar" data-sort="${i}">${escape(s.kopf)}${pfeil}</th>`;
  }).join("");

  const koerper = zeigen.map((r, k) =>
    `<tr><td class="lfd">${zahl(von + k + 1)}</td>` + z.spalten.map(s =>
      `<td class="${s.klasse ?? ""}">${s.roh ? s.wert(r) : escape(String(s.wert(r) ?? ""))}</td>`
    ).join("") + "</tr>").join("");

  behaelter.innerHTML = `
    <div class="reihe" style="margin-bottom:.5rem">
      <input type="text" class="filter" placeholder="filtern …" value="${escape(z.filter)}"
             style="max-width:280px" autocomplete="off">
      <span class="hinweis">${
        z.filter ? `${zahl(gefiltert.length)} von ${zahl(z.zeilen.length)}` : viele(z.zeilen.length, "Zeile", "Zeilen")
      }</span>
      <div style="flex:1"></div>
      <div class="blaettern">
        <button type="button" data-blatt="erste" title="erste Seite">«</button>
        <button type="button" data-blatt="zurueck" title="zurück">‹</button>
        <span class="hinweis" style="min-width:11ch;text-align:center">
          ${zahl(z.seite + 1)} von ${zahl(maxSeite + 1)}</span>
        <button type="button" data-blatt="vor" title="vor">›</button>
        <button type="button" data-blatt="letzte" title="letzte Seite">»</button>
        <input type="text" class="springen" placeholder="zu Zeile" inputmode="numeric" style="width:9ch">
      </div>
      <button type="button" class="mini alsCsv">als CSV</button>
    </div>
    <div class="rahmen"><table><thead><tr><th class="lfd"></th>${kopf}</tr></thead>
      <tbody>${koerper}</tbody></table></div>`;

  const filterfeld = behaelter.querySelector(".filter");
  filterfeld.addEventListener("input", ev => {
    z.filter = ev.target.value;
    z.seite = 0;
    zeichneTabelle(id);
    // Der Fokus geht beim Neuzeichnen verloren; ohne das tippt man nach dem
    // ersten Zeichen ins Leere.
    const f = $(id).querySelector(".filter");
    f.focus();
    f.setSelectionRange(f.value.length, f.value.length);
  });

  behaelter.querySelectorAll("[data-sort]").forEach(th =>
    th.addEventListener("click", () => {
      const i = Number(th.dataset.sort);
      if (z.sortiert === i) z.absteigend = !z.absteigend;
      else { z.sortiert = i; z.absteigend = false }
      z.seite = 0;
      zeichneTabelle(id);
    }));

  behaelter.querySelectorAll("[data-blatt]").forEach(k =>
    k.addEventListener("click", () => {
      const w = k.dataset.blatt;
      z.seite = w === "erste" ? 0
        : w === "zurueck" ? Math.max(z.seite - 1, 0)
        : w === "vor" ? Math.min(z.seite + 1, maxSeite)
        : maxSeite;
      zeichneTabelle(id);
    }));

  behaelter.querySelector(".springen").addEventListener("keydown", ev => {
    if (ev.key !== "Enter") return;
    const n = Number.parseInt(ev.target.value, 10);
    if (Number.isNaN(n)) return;
    z.seite = Math.floor((Math.min(Math.max(n, 1), gefiltert.length) - 1) / SEITE);
    zeichneTabelle(id);
  });

  behaelter.querySelector(".alsCsv").addEventListener("click", () => alsCsv(id));
}

/**
 * Gibt die Liste als CSV aus — vollständig, nicht nur die angezeigte Seite,
 * aber gefiltert und sortiert wie auf dem Bildschirm.
 *
 * Semikolon als Trenner und eine Bytefolge am Anfang, weil deutsche
 * Tabellenkalkulationen die Datei sonst als eine einzige Spalte öffnen.
 *
 * Zusammengesetzt wird stückweise: Eine Zeichenkette aus einer Million Zeilen
 * am Stück zu bilden kostet unnötig Speicher.
 */
function alsCsv(id) {
  const z = tabellenZustand.get(id);
  if (!z) return;
  const feld = (v) => {
    let s = String(v ?? "");
    // Excel wertet einen Wert aus, der mit = + - @ beginnt, als Formel —
    // auch in Anführungszeichen. Eine Telefonnummer „+49 89 …" erscheint
    // dann als #NAME?, und =HYPERLINK(…) trüge Tabelleninhalt nach außen.
    // Ein vorangestelltes Apostroph macht daraus wieder Text; im Bericht
    // soll stehen, was in der Datei steht.
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[";\n\r]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s;
  };
  const zeilen = sichtbareZeilen(z);
  const teile = ["\ufeff" + z.spalten.map(s => feld(s.kopf)).join(";") + "\r\n"];
  const block = [];
  for (const r of zeilen) {
    block.push(z.spalten.map(s => feld(s.csv ? s.csv(r) : s.wert(r))).join(";"));
    if (block.length >= 5000) { teile.push(block.join("\r\n") + "\r\n"); block.length = 0 }
  }
  if (block.length) teile.push(block.join("\r\n") + "\r\n");

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(teile, { type: "text/csv;charset=utf-8" }));
  a.download = z.dateiname;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 30_000);
}

/** Zeichnet alle Tabellen, die im Bericht angelegt wurden. */
function tabellenZeichnen() {
  for (const id of tabellenZustand.keys()) zeichneTabelle(id);
}


/**
 * Alle Unterschiede in einer Liste — was, wo, warum.
 *
 * Der Bericht war bisher nach dem Rechenweg gegliedert: Fingerabdruck,
 * Feldbezeichnungen, Anordnung, Ausprägungen. Das sind die Stufen des
 * Verfahrens, nicht die Frage, mit der jemand herkommt. Die lautet: Was fehlt,
 * wo steht es, und warum ist es ein Unterschied. Diese Liste beantwortet
 * genau das; die Ebenen stehen darunter als Herleitung.
 */
function befundListe(e, einzelheiten) {
  const befunde = [];
  const a = e.a.ersteSchluessel ?? [], b = e.b.ersteSchluessel ?? [];
  const inB = new Set(b), inA = new Set(a);

  // Datensätze, die es nur auf einer Seite gibt.
  for (const k of a) if (!inB.has(k)) befunde.push({
    art: "Datensatz fehlt im Ziel", datensatz: k, feld: "", quelle: "vorhanden", ziel: "fehlt",
  });
  for (const k of b) if (!inA.has(k)) befunde.push({
    art: "Datensatz nur im Ziel", datensatz: k, feld: "", quelle: "fehlt", ziel: "vorhanden",
  });

  // Felder, die es nur auf einer Seite gibt.
  for (const s of e.spalten) {
    if (s.art === "nur-quelle") befunde.push({
      art: "Feld fehlt im Ziel", datensatz: "", feld: feldName(s), quelle: "vorhanden", ziel: "fehlt",
    });
    else if (s.art === "nur-ziel") befunde.push({
      art: "Feld nur im Ziel", datensatz: "", feld: feldName(s), quelle: "fehlt", ziel: "vorhanden",
    });
  }

  // Die einzelnen Werte, sobald der zweite Durchlauf sie geliefert hat.
  //
  // Übersprungen werden Werte aus Datensätzen, die ohnehin schon als fehlend
  // gemeldet sind: Fehlt der Satz, fehlen seine dreiundzwanzig Felder
  // zwangsläufig mit. Diese Zeilen aufzuführen macht aus einem Befund
  // vierundzwanzig und verdeckt die zwei, auf die es ankommt.
  const fehlendeSaetze = new Set(befunde
    .filter(bf => bf.art.startsWith("Datensatz"))
    .map(bf => bf.datensatz));

  for (const u of einzelheiten?.unterschiede ?? []) {
    // Der Schlüssel einer Untertabellenzeile trägt den Datensatz vorn.
    const satz = String(u.schluessel).split("#")[0];
    if (fehlendeSaetze.has(satz)) continue;
    befunde.push({
      art: u.a === undefined ? "Wert nur im Ziel"
         : u.b === undefined ? "Wert fehlt im Ziel" : "Wert abweichend",
      datensatz: u.schluessel,
      feld: (u.tabelle ? u.tabelle + " ▸ " : "") + u.pfad,
      quelle: u.a ?? "", ziel: u.b ?? "",
    });
  }

  // Geänderte Werte nach oben. Beim Abgleich eines Teilbestands gegen den
  // Gesamtbestand sind fehlende Sätze die Erwartung — die zwei geänderten
  // Werte hinter 267 erwarteten Lücken auf Seite 6 findet dagegen niemand.
  const RANG = art => art.startsWith("Wert") ? 0 : 1;
  befunde.sort((x, y) => RANG(x.art) - RANG(y.art));

  return befunde;
}

/**
 * Datensätze ohne Schlüssel sind nicht wiedererkennbar. Sind es alle, ist der
 * ganze Abgleich wertlos — dann darf hier nicht „kein Unterschied" stehen,
 * sondern muss der Grund stehen. Der Kern zählt das seit jeher mit; gesagt
 * wurde es bis hierher nicht.
 */
function ohneSchluesselHinweis(e) {
  const oa = e.a.ohneSchluessel ?? 0, ob = e.b.ohneSchluessel ?? 0;
  if (!oa && !ob) return "";
  const alle = oa >= (e.a.datensaetze ?? 0) && ob >= (e.b.datensaetze ?? 0);
  const feld = $("schluessel").value || "das gewählte Schlüsselfeld";
  return `<div class="hinweis" style="color:var(--schlecht);margin-top:.5rem">
    ${alle
      ? `<b>Der Abgleich sagt so nichts aus.</b> In <i>keinem</i> Datensatz wurde
         <code>${escape(feld)}</code> gefunden — alle Datensätze bekommen denselben
         leeren Schlüssel und gelten damit als gleich. Meist liegt das Feld in einer
         Wiederholgruppe: dann unten eine Untertabelle dafür anlegen oder ein Feld
         wählen, das direkt im Datensatz steht.`
      : `${zahl(oa)} Datensätze der Quelle und ${zahl(ob)} des Ziels haben kein
         vollständiges <code>${escape(feld)}</code>. Sie sind nicht wiedererkennbar und
         werden hilfsweise nach ihrer Position verglichen — verschiebt sich die
         Reihenfolge, meldet das Werkzeug dort Unterschiede, die keine sind.`}
  </div>`;
}

/** Steht das Nachlesen der Einzelwerte noch aus? */
function nochOffenPruefen(e) {
  return e.spalten.some(s => s.art === "abweichend");
}

function feldName(s) {
  return (s.tabelle ? s.tabelle + " ▸ " : "") + s.pfad;
}

/** Zeichnet die Befundliste an ihren Platz. */
function zeigeBefunde(e, einzelheiten) {
  const platz = $("befunde-platz");
  if (!platz) return;
  const befunde = befundListe(e, einzelheiten);

  // Nach Art zusammenfassen, damit auf einen Blick dasteht, worum es geht.
  const nachArt = new Map();
  for (const bf of befunde) nachArt.set(bf.art, (nachArt.get(bf.art) ?? 0) + 1);

  // Wie viele Datensätze haben beide Dateien überhaupt gemeinsam? Das ist
  // der Rahmen für alles Weitere. Bei einem Update gegen einen Gesamtbestand
  // lautet die Frage nicht „welche fehlen", sondern „was hat sich bei den
  // gemeinsamen geändert" — die Zahlen müssen das zeigen.
  const sa = e.a.ersteSchluessel ?? [], sb = e.b.ersteSchluessel ?? [];
  const zielMenge = new Set(sb), quellMenge = new Set(sa);

  // Ein Schlüssel, der mehrfach vorkommt, ordnet Datensätze einander falsch
  // zu: Jede Zahl unten wäre dann erfunden. Also erst prüfen, dann rechnen.
  const mehrfachQ = sa.length - quellMenge.size, mehrfachZ = sb.length - zielMenge.size;
  if (mehrfachQ || mehrfachZ) {
    platz.innerHTML = `<div class="karte">
      <span class="marke schlecht">unbrauchbarer Schlüssel</span>
      <p>Das gewählte Schlüsselfeld <code>${escape($("schluessel").value)}</code> ist nicht
      eindeutig: In der Quelle teilen sich ${zahl(sa.length)} Datensätze nur
      ${zahl(quellMenge.size)} verschiedene Werte${mehrfachZ
        ? `, im Ziel ${zahl(sb.length)} Datensätze nur ${zahl(zielMenge.size)}` : ""}.</p>
      <p>Damit lässt sich kein Datensatz wiedererkennen, und jede Zahl wäre geraten —
      deshalb steht hier keine. Ein Schlüssel muss je Datensatz genau einmal vorkommen.
      Liegt das Feld in einer Wiederholgruppe (mehrere Kennungen je Datensatz), oben eine
      Untertabelle dafür anlegen; sonst ein Feld wählen, das den Datensatz eindeutig
      benennt.</p></div>`;
    return;
  }

  const gemeinsame = sa.filter(k => zielMenge.has(k));
  const nurQ = sa.filter(k => !zielMenge.has(k)).length;
  const nurZ = sb.filter(k => !quellMenge.has(k)).length;

  const geaenderteSaetze = new Set(
    befunde.filter(bf => bf.art.startsWith("Wert"))
           .map(bf => String(bf.datensatz).split("#")[0]));

  // Ohne Schnittmenge ist jede weitere Zahl bedeutungslos, und der Grund liegt
  // fast nie in den Daten, sondern in der Auswahl: falsches Gegenstück oder ein
  // Schlüsselfeld, das auf beiden Seiten etwas anderes benennt. Statt „0" zu
  // melden und den Nutzer raten zu lassen, wird beides nebeneinandergestellt.
  if (!gemeinsame.length && sa.length && sb.length) {
    // Die Beispiele NICHT nebeneinander in eine Tabelle: Eine Tabellenzeile
    // behauptet, die beiden Werte gehörten zusammen. Hier sind es zwei
    // unabhängige Listen, und ein „—" läse sich als „fehlt" statt als
    // „diese Liste ist kürzer".
    const probe = (titel, liste, datei) => `
      <div style="margin:.6rem 0">
        <div class="hinweis">${titel} — ${escape(datei ?? "")}, ${saetze(liste.length)}</div>
        ${liste.slice(0, 3).map(s => `<div><code>${escape(s)}</code></div>`).join("")}
        ${liste.length > 3 ? `<div class="hinweis">… und ${zahl(liste.length - 3)} weitere</div>` : ""}
      </div>`;

    // Bei sehr unterschiedlicher Größe ist fast immer die Dateiauswahl schuld,
    // nicht das Schlüsselfeld. Dann zuerst danach fragen.
    const gross = Math.max(sa.length, sb.length), klein = Math.min(sa.length, sb.length);
    const schief = gross >= klein * 20;

    platz.innerHTML = `<div class="karte">
      <span class="marke schlecht">nichts gemeinsam</span>
      <p>Kein einziger Datensatz kommt in beiden Dateien vor.</p>
      ${probe("In der Quelle steht", sa, dateien.a?.name)}
      ${probe("Im Ziel steht", sb, dateien.b?.name)}
      <p>${schief
        ? `Die eine Datei ist ${Math.round(gross / Math.max(1, klein))}-mal so groß wie die
           andere und die Bezeichnungen haben nichts miteinander zu tun. <b>Sind das die
           beiden Dateien, die Sie vergleichen wollten?</b> Zusammen gehören meist ein
           Anfangs- und ein Änderungsstand desselben Bestands.`
        : `Sehen die Werte gleichartig aus, sind es zwei verschiedene Bestände. Sehen sie
           verschieden aus, benennt <code>${escape($("schluessel").value)}</code> auf beiden
           Seiten nicht dasselbe — dann oben ein anderes Schlüsselfeld wählen.`}</p>
    </div>`;
    return;
  }

  const rahmen = `<div class="karte">
      <div class="hinweis" style="margin-bottom:.5rem">
        <b>${escape(dateien.a?.name ?? "Quelle")}</b> (${saetze(e.a.datensaetze)})
        gegen <b>${escape(dateien.b?.name ?? "Ziel")}</b> (${zahl(e.b.datensaetze)}),
        wiedererkannt an <code>${escape($("schluessel").value)}</code></div>
      <table style="margin:0">
        <tr><td><b>${zahl(gemeinsame.length)}</b> ${gemeinsame.length === 1 ? "Datensatz" : "Datensätze"} in beiden Dateien</td>
            <td class="zahl">${gemeinsame.length
              ? (geaenderteSaetze.size
                  ? `<span class="marke schlecht">${zahl(geaenderteSaetze.size)} davon geändert</span>`
                  : (nochOffenPruefen(e) ? `<span class="hinweis">wird geprüft …</span>`
                                         : `<span class="marke gut">alle gleich</span>`))
              : ""}</td></tr>
        <tr><td>${zahl(nurQ)} nur in der Quelle</td><td class="zahl hinweis">
            ${nurQ ? "im Ziel nicht enthalten" : ""}</td></tr>
        <tr><td>${zahl(nurZ)} nur im Ziel</td><td class="zahl hinweis">
            ${nurZ ? "in der Quelle nicht enthalten" : ""}</td></tr>
      </table>
      ${ohneSchluesselHinweis(e)}
      ${(e.a.schluesselGekappt || e.b.schluesselGekappt) ? `
        <div class="hinweis" style="color:var(--schlecht);margin-top:.5rem">
          Mehr als ${zahl(1000000)} Datensätze — ab dort sind die Schlüssel nicht mehr
          einzeln gemerkt. Die Zahlen oben zählen nur die gemerkten; die Fingerabdrücke
          unten prüfen weiterhin alles.</div>` : ""}
    </div>`;

  if (!befunde.length) {
    platz.innerHTML = rahmen + `<div class="karte"><span class="marke gut">gleich</span>
      Kein Unterschied gefunden.</div>`;
    return;
  }

  const nochOffen = !einzelheiten && e.spalten.some(s => s.art === "abweichend");

  platz.innerHTML = rahmen + `
    <div class="karte">
      ${[...nachArt.entries()].map(([art, n]) =>
        `<div style="margin:.15rem 0"><b>${zahl(n)}</b> × ${escape(art)}</div>`).join("")}
      ${nachArt.has("Datensatz fehlt im Ziel") || nachArt.has("Datensatz nur im Ziel")
        ? `<div class="hinweis" style="margin-top:.5rem">Die Felder fehlender Datensätze
           sind nicht einzeln aufgeführt — sie fehlen mit dem Satz.</div>` : ""}
      ${nochOffen ? `<div class="hinweis" style="margin-top:.5rem">
        <span class="loading">Die einzelnen Werte werden noch nachgelesen</span></div>` : ""}
    </div>
    ${datenTabelle("t-befunde", [
      { kopf: "Was", wert: bf => bf.art },
      { kopf: "Datensatz", wert: bf => bf.datensatz, klasse: "pfad" },
      { kopf: "Feld", wert: bf => bf.feld, klasse: "pfad" },
      { kopf: "Quelle", csv: bf => bf.quelle, roh: true,
        wert: bf => bf.art === "Wert abweichend" ? hervorheben(bf.quelle, bf.ziel) : escape(bf.quelle) },
      { kopf: "Ziel", csv: bf => bf.ziel, roh: true,
        wert: bf => bf.art === "Wert abweichend" ? hervorheben(bf.ziel, bf.quelle) : escape(bf.ziel) },
    ], befunde, "unterschiede.csv")}`;
  tabellenZeichnen();
}

/* ─────────────────────────────────────────── Bericht */

/** Weichen die Datensatzzahlen ab? Dann ist alles Weitere Folge davon. */
function mengeAnders(e) { return e.a.datensaetze !== e.b.datensaetze }

function zeigeBericht(e, datensatz, schluessel, ziel = null) {
  const t = [];

  // Wurde überhaupt etwas erfasst? Passt der Datensatzpfad auf kein Element,
  // bleiben beide Abdrücke leer — und leer ist gleich leer. Das Werkzeug hat
  // dann für zwei beliebige Dateien „kein Unterschied" gemeldet. Ohne
  // Datensätze gibt es kein Urteil, nur die Frage nach dem Pfad.
  if (!e.a.datensaetze || !e.b.datensaetze) {
    const leer = [];
    if (!e.a.datensaetze) leer.push(escape(e.dateiA?.name ?? "die Quelle"));
    if (!e.b.datensaetze) leer.push(escape(e.dateiB?.name ?? "das Ziel"));
    (ziel ?? $("ergebnis")).innerHTML = `<h2>Unterschiede</h2>
      <div class="karte"><span class="marke schlecht">nichts erfasst</span>
      <p>In ${leer.join(" und ")} wurde <b>kein einziger Datensatz</b> gefunden.
      Verglichen wurde damit nichts — und weil zwei leere Ergebnisse zwangsläufig
      gleich sind, stünde hier sonst fälschlich „kein Unterschied".</p>
      <p>Das Datensatz-Element <code>${escape(datensatz)}</code> passt auf kein
      Element dieser Datei. Prüfen Sie den Pfad oben; er wird an der Quelle
      erkundet und auf beide Dateien angewandt, muss also in beiden vorkommen.</p>
      </div>`;
    return;
  }

  // Die Befundliste zuerst — sie beantwortet die Frage. Die Ebenen darunter
  // zeigen, wie das Werkzeug darauf gekommen ist.
  t.push(`<h2>Unterschiede</h2><div id="befunde-platz"></div>`);
  t.push(`<details class="karte" style="margin-top:1.5rem"><summary style="cursor:pointer">
      <b>Wie das geprüft wurde</b>
      <span class="hinweis">— vier Ebenen, zum Aufklappen</span>
    </summary><div id="ebenen" style="margin-top:1rem">`);

  // ── Ebene 1 ── Fingerabdruck: gleich oder nicht.
  const gleich = e.a.gesamt === e.b.gesamt;
  t.push(`<h2>1 · Fingerabdruck</h2>
    <div class="karte" style="text-align:center">
      <div style="display:flex;gap:1.5rem;justify-content:center;align-items:center;flex-wrap:wrap;margin:.4rem 0">
        <code style="font-size:1.15rem;letter-spacing:.04em">${e.a.gesamt}</code>
        <span style="font-size:1.3rem;color:var(--${gleich ? "gut" : "schlecht"})">${gleich ? "=" : "≠"}</span>
        <code style="font-size:1.15rem;letter-spacing:.04em">${e.b.gesamt}</code>
      </div>
      <div class="hinweis">${gleich
        ? "Gleich — eine Abweichung ist damit sehr unwahrscheinlich, aber nicht ausgeschlossen."
        : "Verschieden. Die Ebenen darunter sagen, worin."}</div>
      ${(e.a.stimmig === false || e.b.stimmig === false) ? `<div class="hinweis" style="color:var(--schlecht);margin-top:.5rem">
        <b>Achtung:</b> Spalten- und Zeilenachse ergeben nicht dieselbe Summe. Der Abdruck ist fehlerhaft.
      </div>` : ""}
    </div>`);

  t.push(`<div class="karte"><div class="paar">
    ${seite("Quelle", e.dateiA, e.a)}
    ${seite("Ziel", e.dateiB, e.b)}
  </div></div>`);

  // Haben die Dateien überhaupt gemeinsame Datensätze? Wenn nicht, ist alles
  // Weitere Rauschen — dann gehört diese Auskunft nach oben und nicht unter
  // einundzwanzig Feldzeilen.
  const schluesselA = e.a.ersteSchluessel ?? [], schluesselB = e.b.ersteSchluessel ?? [];
  const inZiel = new Set(schluesselB);
  const gemeinsameZahl = schluesselA.filter(k => inZiel.has(k)).length;
  const ohneSchnittmenge = gemeinsameZahl === 0 && schluesselA.length > 0 && schluesselB.length > 0;

  if (ohneSchnittmenge) {
    t.push(`<div class="karte" style="border-color:var(--schlecht)">
      <b>Die beiden Dateien haben keinen einzigen Datensatz gemeinsam.</b>
      <div class="hinweis" style="margin-top:.4rem">
        Verglichen wurde über <code>${escape(String(schluessel || "—"))}</code>.
        Quelle: ${zahl(e.a.datensaetze)} Datensätze, z. B. <code>${escape(schluesselA[0] ?? "")}</code>.
        Ziel: ${zahl(e.b.datensaetze)}, z. B. <code>${escape(schluesselB[0] ?? "")}</code>.
        Entweder gehören die Dateien nicht zusammen, oder das Schlüsselfeld passt nicht.
        Alles Folgende vergleicht dann zwei Bestände ohne Berührungspunkt.
      </div>
    </div>`);
  }

  // ── Ebene 2 ── Feldbezeichnungen: welche Felder gibt es hier und dort.
  const felderTab = (e.tabellen ?? []).flatMap(tb => [
    ...(tb.ta?.spalten ?? []).map(s => ({ tabelle: tb.name, pfad: s[0], seite: "beide" })),
  ]);
  const strukturUnterschiede = e.spalten.filter(s => s.art !== "abweichend");
  const strukturGleich = strukturUnterschiede.length === 0;

  t.push(`<h2>2 · Feldbezeichnungen</h2>`);
  t.push(`<div class="karte">
    <span class="marke ${strukturGleich ? "gut" : "schlecht"}">${strukturGleich ? "gleich" : "abweichend"}</span>
    ${strukturGleich
      ? `Beide Seiten kennen dieselben ${zahl(felderTab.length)} Felder.`
      : `${viele(strukturUnterschiede.length, "Feld kommt", "Felder kommen")} nur auf einer Seite vor.`}
  </div>`);
  t.push(datenTabelle("t-struktur", [
    { kopf: "Tabelle", wert: s => s.tabelle || "(Datensatz)" },
    { kopf: "Feld", wert: s => s.pfad, klasse: "pfad" },
    { kopf: "Quelle", wert: s => s.a ? "vorhanden" : "fehlt" },
    { kopf: "Ziel", wert: s => s.b ? "vorhanden" : "fehlt" },
  ], strukturUnterschiede.length ? strukturUnterschiede : [], "2_feldbezeichnungen.csv"));

  // ── Ebene 3 ── Anordnung und Satzfolge.
  const anordnungGleich = e.a.anordnung === e.b.anordnung;
  const folgeGleich = e.folgeGleich;
  t.push(`<h2>3 · Anordnung und Reihenfolge</h2>`);
  if (ohneSchnittmenge) {
    t.push(`<div class="karte hinweis">Ohne gemeinsame Datensätze sagt die Reihenfolge nichts.</div>`);
  }
  t.push(`<div class="karte">
    <div><span class="marke ${anordnungGleich ? "gut" : "schlecht"}">${anordnungGleich ? "gleich" : "abweichend"}</span>
      Anordnung der Felder im Datensatz</div>
    <div style="margin-top:.5rem"><span class="marke ${folgeGleich ? "gut" : "schlecht"}">${folgeGleich ? "gleich" : "abweichend"}</span>
      Reihenfolge der Datensätze${!folgeGleich ? " — " + satzfolgeText(e) : ""}</div>
  </div>`);
  if (!anordnungGleich && !ohneSchnittmenge) t.push(strukturTabelle(e));

  // Die Satzfolge als Liste — aber nur, wenn beide Seiten dieselben
  // Datensätze haben. Stehen dort verschiedene Bestände, ist jede Zeile
  // „hier X, dort nichts" und die Liste sagt nichts über die Reihenfolge.
  const a = e.a.ersteSchluessel ?? [], b = e.b.ersteSchluessel ?? [];
  const mengeB = new Set(b);
  const gemeinsameSaetze = a.filter(k => mengeB.has(k)).length;

  if (!folgeGleich && gemeinsameSaetze > 0 && !ohneSchnittmenge) {
    const folgeZeilen = [];
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      if (a[i] !== b[i]) folgeZeilen.push({ nr: i + 1, a: a[i] ?? "—", b: b[i] ?? "—" });
    }
    t.push(datenTabelle("t-folge", [
      { kopf: "Stelle", wert: z => z.nr, zahl: true, klasse: "zahl" },
      { kopf: "Quelle", wert: z => z.a, klasse: "pfad" },
      { kopf: "Ziel", wert: z => z.b, klasse: "pfad" },
    ], folgeZeilen, "3_reihenfolge.csv"));
  } else if (!folgeGleich && !ohneSchnittmenge) {
    t.push(`<div class="karte hinweis">Die beiden Dateien enthalten verschiedene
      Datensätze — über die Reihenfolge lässt sich damit nichts sagen.</div>`);
  }

  // ── Ebene 4 ── Ausprägungen: welche Werte weichen ab.
  const werteFelder = e.spalten.filter(s => s.art === "abweichend");
  const werteGleich = werteFelder.length === 0 && !e.eimer.length;
  t.push(`<h2>4 · Ausprägungen</h2>`);
  t.push(`<div class="karte">
    <span class="marke ${werteGleich ? "gut" : "schlecht"}">${werteGleich ? "gleich" : "abweichend"}</span>
    ${werteGleich ? "Alle Werte stimmen überein."
      : `In ${viele(werteFelder.length, "Feld", "Feldern")} weichen Werte ab.`}
    ${e.a.datensaetze !== e.b.datensaetze
      ? ` <b>${zahl(e.a.datensaetze)} Datensätze in der Quelle, ${zahl(e.b.datensaetze)} im Ziel</b>
          — fehlende Datensätze bringen fehlende Werte mit.` : ""}
  </div>`);
  const feldliste = datenTabelle("t-felder", [
    { kopf: "Tabelle", wert: s => s.tabelle || "(Datensatz)" },
    { kopf: "Feld", wert: s => s.pfad, klasse: "pfad" },
    { kopf: "Werte Quelle", wert: s => s.a ? s.a[3] : 0, zahl: true, klasse: "zahl" },
    { kopf: "Werte Ziel", wert: s => s.b ? s.b[3] : 0, zahl: true, klasse: "zahl" },
  ], werteFelder, "4_felder_mit_abweichung.csv");
  // Ohne Schnittmenge weicht zwangsläufig jedes Feld ab — dann ist die Liste
  // erwartbar und steht eingeklappt da, statt den Bericht zu füllen.
  t.push(ohneSchnittmenge && feldliste
    ? `<details class="karte"><summary style="cursor:pointer">
         ${viele(werteFelder.length, "Feld", "Felder")} — zwangsläufig, weil kein
         Datensatz gemeinsam ist <span class="hinweis">(zum Aufklappen)</span></summary>
       <div style="margin-top:.75rem">${feldliste}</div></details>`
    : feldliste);

  // Die einzelnen Werte kommen aus dem zweiten Durchlauf und werden hier
  // nachgereicht.
  t.push(`<div id="werte-platz"></div>`);

  t.push(`</div></details>`);

  t.push(`<h2>Nicht geprüft</h2><div class="karte"><ul class="grenzen">
    <li>Die Prüfwerte schützen vor Versehen, nicht vor absichtlicher Veränderung —
        FNV-1a ist kein kryptographisches Verfahren.</li>
    <li>Entitäten (<code>&amp;amp;</code> und dergleichen) werden nicht aufgelöst,
        sondern verglichen wie sie dastehen.</li>
    <li>Ab dem 65. gleichnamigen Feld einer Zeile werden die weiteren zusammengefasst
        (<code>FELD[…]</code>).</li>
  </ul></div>`);

  (ziel ?? $("ergebnis")).innerHTML = t.join("");
  tabellenZeichnen();
  zeigeBefunde(e, e.gemerkteEinzelheiten ?? null);
}

/**
 * Zeigt, wo sich der Aufbau unterscheidet.
 *
 * Verglichen werden die Feldfolgen als Namenslisten — nicht nur die
 * häufigste. Ist ein einzelner Datensatz von 401 umgestellt, bleibt die
 * häufigste Folge auf beiden Seiten gleich und die Abweichung steckt in einer
 * seltenen. Genau die muss der Bericht finden.
 */
function strukturTabelle(e) {
  const alsNamen = (abdruck) => (abdruck.folgen ?? []).map(f => ({
    namen: f.felder.map(n => abdruck.feldIndex[n] ?? "?"),
    anzahl: f.anzahl,
  }));
  const fa = alsNamen(e.a), fb = alsNamen(e.b);
  const schluessel = f => f.namen.join("\u001f");

  const inB = new Set(fb.map(schluessel));
  const inA = new Set(fa.map(schluessel));
  const nurQuelle = fa.filter(f => !inB.has(schluessel(f)));
  const nurZiel = fb.filter(f => !inA.has(schluessel(f)));

  if (!nurQuelle.length && !nurZiel.length) return "";

  // Die abweichende Folge gegen die nächstverwandte der anderen Seite
  // stellen: die, die die meisten Felder an derselben Stelle hat.
  const naechste = (folge, kandidaten) => {
    let beste = null, bestwert = -1;
    for (const k of kandidaten) {
      let treffer = 0;
      for (let i = 0; i < Math.max(folge.namen.length, k.namen.length); i++) {
        if (folge.namen[i] === k.namen[i]) treffer++;
      }
      if (treffer > bestwert) { bestwert = treffer; beste = k }
    }
    return beste;
  };

  const t = [`<div class="karte"><b>Aufbau eines Datensatzes</b>
    <div class="hinweis" style="margin-bottom:.6rem">
      ${[
        nurQuelle.length ? `${viele(nurQuelle.length, "Feldfolge kommt", "Feldfolgen kommen")} nur in der Quelle vor` : "",
        nurZiel.length ? `${viele(nurZiel.length, "Feldfolge kommt", "Feldfolgen kommen")} nur im Ziel vor` : "",
      ].filter(Boolean).join(", ")}.
    </div>`];

  const paare = nurZiel.length
    ? nurZiel.map(z => ({ ziel: z, quelle: naechste(z, fa) }))
    : nurQuelle.map(q => ({ quelle: q, ziel: naechste(q, fb) }));

  for (const paar of paare.slice(0, 3)) {
    const q = paar.quelle?.namen ?? [], z = paar.ziel?.namen ?? [];
    const mengeQ = new Set(q), mengeZ = new Set(z);
    const zeilen = [];
    for (let i = 0; i < Math.max(q.length, z.length); i++) {
      const x = q[i], y = z[i];
      let marke = "", art = "";
      if (x === y) art = "";
      else if (x === undefined) { art = "nur im Ziel"; marke = "warnung" }
      else if (y === undefined) { art = "fehlt im Ziel"; marke = "warnung" }
      else if (mengeQ.has(y) && mengeZ.has(x)) { art = "umgestellt"; marke = "warnung" }
      else { art = "anderes Feld"; marke = "schlecht" }
      zeilen.push({ pos: i + 1, x, y, art, marke });
    }
    const abweichend = zeilen.filter(z2 => z2.marke);
    if (!abweichend.length) continue;

    t.push(`<div class="hinweis" style="margin:.75rem 0 .35rem">
      ${zahl(paar.quelle?.anzahl ?? 0)} Datensätze in der Quelle gegen
      ${zahl(paar.ziel?.anzahl ?? 0)} im Ziel —
      ${viele(abweichend.length, "Stelle weicht", "Stellen weichen")} ab.
    </div>
    <div class="rahmen"><table><thead><tr>
      <th class="zahl">Nr.</th><th>Quelle</th><th>Ziel</th><th></th>
    </tr></thead><tbody>`);
    // Nur die Abweichungen samt einer Zeile Umgebung — die Folge kann lang sein.
    const zeigen = new Set();
    abweichend.forEach(a => { zeigen.add(a.pos - 1); zeigen.add(a.pos); zeigen.add(a.pos + 1) });
    let ausgelassen = false;
    for (const z2 of zeilen) {
      if (!zeigen.has(z2.pos)) { ausgelassen = true; continue }
      if (ausgelassen) {
        t.push(`<tr><td colspan="4" class="hinweis">…</td></tr>`);
        ausgelassen = false;
      }
      t.push(`<tr>
        <td class="zahl">${z2.pos}</td>
        <td class="pfad">${z2.x === undefined ? "–" : escape(z2.x)}</td>
        <td class="pfad">${z2.y === undefined ? "–" : escape(z2.y)}</td>
        <td>${z2.marke ? `<span class="marke ${z2.marke}">${z2.art}</span>` : ""}</td>
      </tr>`);
    }
    t.push(`</tbody></table></div>`);
  }

  t.push(`</div>`);
  return t.join("");
}

/**
 * Beschreibt, wo die Satzfolge auseinanderläuft.
 *
 * Ob eine Umsortierung hinnehmbar ist, hängt vom Verarbeitungsweg ab — manche
 * Ladeprogramme arbeiten in Dokumentfolge und bauen Abhängigkeiten zwischen
 * Sätzen auf. Das Werkzeug stellt fest und bewertet nicht.
 */
function satzfolgeText(e) {
  const a = e.a.ersteSchluessel ?? [], b = e.b.ersteSchluessel ?? [];
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;

  if (i >= a.length && i >= b.length) {
    return "Die Datensätze stehen in anderer Reihenfolge.";
  }
  const mengeA = new Set(a), mengeB = new Set(b);
  const hier = a[i], dort = b[i];

  if (hier !== undefined && dort !== undefined && mengeA.has(dort) && mengeB.has(hier)) {
    return `Ab dem ${zahl(i + 1)}. Datensatz stehen dieselben Sätze in anderer Folge: ` +
           `Quelle „${escape(hier)}", Ziel „${escape(dort)}". Ob das zählt, hängt davon ab, ob das Zielsystem ` +
           `in Dokumentfolge verarbeitet.`;
  }
  if (dort !== undefined && !mengeA.has(dort)) {
    return `Ab dem ${zahl(i + 1)}. Datensatz: Im Ziel steht „${escape(dort)}", ` +
           `der in der Quelle nicht vorkommt.`;
  }
  if (hier !== undefined && !mengeB.has(hier)) {
    return `Ab dem ${zahl(i + 1)}. Datensatz: „${escape(hier)}" aus der Quelle fehlt im Ziel.`;
  }
  return `Die Folge läuft ab dem ${zahl(i + 1)}. Datensatz auseinander.`;
}

function seite(titel, angaben, abdruck) {
  return `<div>
    <div class="hinweis">${titel}</div>
    <div style="font-weight:600;word-break:break-all">${escape(angaben?.name ?? titel)}</div>
    <table style="margin-top:.5rem">
      <tr><td>Datensätze</td><td class="zahl">${zahl(abdruck.datensaetze)}</td></tr>
      <tr><td>Felder mit Wert</td><td class="zahl">${zahl(
        (abdruck.tabellen ?? []).reduce((n, x) => n + (x.felder ?? 0), 0))}</td></tr>
      <tr><td>Tabellen</td><td class="zahl">${zahl((abdruck.tabellen ?? []).length)}</td></tr>
      <tr><td>Umfang</td><td class="zahl">${angaben?.groesse == null ? "–" : groesse(angaben.groesse)}</td></tr>
    </table></div>`;
}

function escape(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}


/* ─────────────────────────────────────── Merken über das Neuladen hinweg
 *
 * Zwei Dinge werden aufbewahrt:
 *
 *  • **Einstellungen und Ergebnis** in localStorage — Kilobyte, immer
 *    verfügbar. Der Bericht ist damit nach einem Neuladen sofort wieder da.
 *  • **Dateiverweise** in IndexedDB. Ein solcher Verweis lässt sich nur über
 *    den Systemdialog gewinnen (`showOpenFilePicker`); die klassische
 *    Dateiauswahl liefert nur den Inhalt, keinen dauerhaften Bezug. Deshalb
 *    gibt es beide Wege nebeneinander.
 *
 * Die Datei selbst wird nie gespeichert — nur der Verweis darauf. Beim
 * nächsten Öffnen fragt der Browser nach Erlaubnis, und erst dann wird
 * gelesen.
 */
const LAGER = "xmlabgleich";
const SCHLUESSEL_STAND = LAGER + ":stand";

/**
 * Wirft aus einem Bericht heraus, was nur zum Rechnen gebraucht wurde.
 *
 * Die Eimerlisten sind bei sechs Tabellen und 4096 Eimern über eine Million
 * Zahlen — sie sprengen den Speicher des Browsers, und angezeigt wird davon
 * nichts. Was bleibt, ist der Bericht selbst.
 */
function schlank(bericht) {
  if (!bericht) return null;
  const ohneEimer = (abdruck) => abdruck && ({
    ...abdruck,
    tabellen: (abdruck.tabellen ?? []).map(({ eimer, ...rest }) => rest),
    // Nicht kürzen: Diese Liste beantwortet die Frage, welche Datensätze
    // fehlen. Gekürzt gespeichert war sie nach einem Neuladen unvollständig,
    // ohne dass es auffiel.
    ersteSchluessel: abdruck.ersteSchluessel ?? [],
  });
  return {
    ...bericht,
    a: ohneEimer(bericht.a),
    b: ohneEimer(bericht.b),
    tabellen: (bericht.tabellen ?? []).map(tb => ({
      ...tb,
      ta: tb.ta && { ...tb.ta, eimer: undefined },
      tb: tb.tb && { ...tb.tb, eimer: undefined },
      eimer: tb.eimer.slice(0, 50),
    })),
    eimer: (bericht.eimer ?? []).slice(0, 50),
    // Nicht kürzen: Diese Liste trägt die Befunde („Feld fehlt im Ziel").
    // Gekürzt gespeichert meldete der Bericht nach dem Neuladen 300 statt
    // 390 — ohne Hinweis. Gespart hätte es ohnehin nichts, die vollständige
    // Fassung steckt in tabellen[].spalten.
    spalten: bericht.spalten ?? [],
  };
}

function standSpeichern(zusatz = {}) {
  try {
    if (zusatz.bericht !== undefined || zusatz.einzelheiten !== undefined) {
      const gross = {};
      if (zusatz.bericht !== undefined) gross.bericht = schlank(zusatz.bericht);
      if (zusatz.einzelheiten !== undefined) gross.einzelheiten = zusatz.einzelheiten;
      const { bericht, einzelheiten, ...klein } = zusatz;
      zusatz = { ...klein, imLager: true };
      // Kein await: Der Aufrufer soll nicht warten. Scheitert es, sagt es der
      // Nutzer erfährt es beim nächsten Laden — nicht nur die Konsole.
      grossMerken("stand", gross).then(() => {
        localStorage.removeItem(SCHLUESSEL_STAND + ":fehler");
      }).catch(e => {
        console.warn("Bericht nicht merkbar:", e);
        localStorage.setItem(SCHLUESSEL_STAND + ":fehler", String(e?.message ?? e));
      });
    }
    const stand = {
      // Über den vorhandenen Stand schreiben, nicht ersetzen. Sonst
      // verschwindet `imLager` bei jedem Aufruf ohne Bericht — etwa beim
      // Wechsel des Schlüsselfelds — und der gemerkte Bericht ist weg.
      ...(standLesen() ?? {}),
      zeit: Date.now(),
      datensatz: $("datensatz").value,
      schluessel: $("schluessel").value,
      kandidaten: [...$("schluessel").options].map(o => ({ v: o.value, t: o.textContent })),
      erkundet: $("erkundet").textContent,
      hinweis: $("schluessel-hinweis").textContent,
      namen: { a: dateien.a?.name ?? null, b: dateien.b?.name ?? null },
      groessen: { a: dateien.a?.size ?? null, b: dateien.b?.size ?? null },
      ...zusatz,
    };
    localStorage.setItem(SCHLUESSEL_STAND, JSON.stringify(stand));
  } catch (e) {
    // Voller oder gesperrter Speicher darf die Arbeit nicht anhalten.
    console.warn("Stand nicht speicherbar:", e);
  }
}

function standLesen() {
  try {
    return JSON.parse(localStorage.getItem(SCHLUESSEL_STAND) || "null");
  } catch { return null }
}

/* ---- Dateiverweise in IndexedDB ---- */

function db() {
  return new Promise((ok, fehler) => {
    const a = indexedDB.open(LAGER, 2);
    a.onupgradeneeded = () => {
      if (!a.result.objectStoreNames.contains("verweise")) a.result.createObjectStore("verweise");
      if (!a.result.objectStoreNames.contains("berichte")) a.result.createObjectStore("berichte");
    };
    a.onsuccess = () => {
      // Damit ein späterer Versionswechsel nicht an dieser Verbindung
      // hängenbleibt.
      a.result.onversionchange = () => a.result.close();
      ok(a.result);
    };
    a.onerror = () => fehler(a.error);
    a.onblocked = () => fehler(new Error(
      "Ein anderes Fenster mit dieser Seite hält den Speicher offen — "
      + "bitte die übrigen Fenster schließen."));
  });
}

async function verweisMerken(seite, verweis) {
  if (!verweis) return;
  try {
    const d = await db();
    await new Promise((ok, fehler) => {
      const t = d.transaction("verweise", "readwrite");
      t.objectStore("verweise").put(verweis, seite);
      t.oncomplete = ok; t.onerror = () => fehler(t.error);
    });
  } catch (e) { console.warn("Verweis nicht merkbar:", e) }
}

async function verweisHolen(seite) {
  try {
    const d = await db();
    return await new Promise((ok, fehler) => {
      const t = d.transaction("verweise", "readonly");
      const a = t.objectStore("verweise").get(seite);
      a.onsuccess = () => ok(a.result || null);
      a.onerror = () => fehler(a.error);
    });
  } catch { return null }
}

/** Bericht und Einzelheiten: zu groß für localStorage, also ins Lager. */
async function grossMerken(name, wert) {
  const d = await db();
  await new Promise((ok, fehler) => {
    const t = d.transaction("berichte", "readwrite");
    t.objectStore("berichte").put(wert, name);
    t.oncomplete = ok; t.onerror = () => fehler(t.error);
  });
}

async function grossHolen(name) {
  try {
    const d = await db();
    return await new Promise((ok, fehler) => {
      const t = d.transaction("berichte", "readonly");
      const a = t.objectStore("berichte").get(name);
      a.onsuccess = () => ok(a.result ?? null);
      a.onerror = () => fehler(a.error);
    });
  } catch { return null }
}

async function vergessen() {
  localStorage.removeItem(SCHLUESSEL_STAND);
  try {
    const d = await db();
    const t = d.transaction(["verweise", "berichte"], "readwrite");
    t.objectStore("verweise").clear();
    t.objectStore("berichte").clear();
  } catch {}
  location.reload();
}

/** Öffnet über den Systemdialog — nur so entsteht ein merkbarer Verweis. */
async function ueberDialog(seite) {
  try {
    const [verweis] = await window.showOpenFilePicker({
      types: [{ description: "XML", accept: { "text/xml": [".xml"] } }],
      multiple: false,
    });
    await verweisMerken(seite, verweis);
    await uebernehmen(seite, await verweis.getFile());
  } catch (e) {
    if (e?.name !== "AbortError") console.warn(e);
  }
}

/** Stellt die zuletzt benutzten Dateien wieder her, soweit erlaubt. */
async function wiederherstellen() {
  const stand = standLesen();
  if (!stand) return;

  // Was beim letzten Mal nicht in den Speicher passte, gehört gesagt —
  // sonst ist der Bericht einfach weg und niemand weiß warum.
  const speicherFehler = localStorage.getItem(SCHLUESSEL_STAND + ":fehler");
  if (speicherFehler) {
    localStorage.removeItem(SCHLUESSEL_STAND + ":fehler");
    $("ergebnis").insertAdjacentHTML("afterbegin", `<div class="karte">
      <span class="marke schlecht">nicht gemerkt</span> Der letzte Bericht war zu groß
      für den Browser-Speicher (${escape(speicherFehler)}). Bitte neu vergleichen.</div>`);
  }

  // Bericht und Einzelheiten liegen im Lager, nicht im kleinen Speicher.
  if (stand.imLager) {
    const gross = await grossHolen("stand");
    if (gross) {
      if (gross.bericht !== undefined) stand.bericht = gross.bericht;
      if (gross.einzelheiten !== undefined) stand.einzelheiten = gross.einzelheiten;
    }
  }

  // Einstellungen zuerst — sie gelten auch ohne Dateien.
  if (stand.kandidaten?.length) {
    const wahl = $("schluessel");
    wahl.innerHTML = "";
    for (const k of stand.kandidaten) {
      const o = document.createElement("option");
      o.value = k.v; o.textContent = k.t; wahl.append(o);
    }
    wahl.value = stand.schluessel ?? "";
  }
  if (stand.datensatz) $("datensatz").value = stand.datensatz;
  if (stand.erkundet) $("erkundet").textContent = stand.erkundet;
  if (stand.hinweis) $("schluessel-hinweis").textContent = stand.hinweis;
  if (stand.datensatz || stand.kandidaten?.length) $("aufbau").classList.remove("verborgen");

  // Dann die Dateien, wenn der Browser den Verweis noch hergibt.
  let wieder = 0;
  for (const seite of ["a", "b"]) {
    const verweis = await verweisHolen(seite);
    if (!verweis) continue;
    try {
      const erlaubt = await verweis.queryPermission?.({ mode: "read" });
      if (erlaubt === "granted") {
        dateien[seite] = await verweis.getFile();
        $("name-" + seite).textContent = dateien[seite].name;
        $("groesse-" + seite).textContent = groesse(dateien[seite].size);
        wieder++;
      } else {
        // Ohne Nachfrage geht es nicht — der Browser verlangt eine Geste.
        $("name-" + seite).textContent = verweis.name;
        $("groesse-" + seite).innerHTML =
          `<button type="button" class="mini" data-freigeben="${seite}">wieder öffnen</button>`;
      }
    } catch { /* Verweis ins Leere */ }
  }
  $("starten").disabled = !(dateien.a && dateien.b);

  if (stand.bericht) {
    zeigeGemerktenBericht(stand);
  }
  return wieder;
}

/** Zeigt den zuletzt erzeugten Bericht, mit deutlichem Hinweis auf sein Alter. */
function zeigeGemerktenBericht(stand) {
  const alter = Math.round((Date.now() - stand.zeit) / 60000);
  const wann = alter < 1 ? "gerade eben"
    : alter < 60 ? `vor ${viele(alter, "Minute", "Minuten")}`
    : alter < 1440 ? `vor ${viele(Math.round(alter / 60), "Stunde", "Stunden")}`
    : `vor ${viele(Math.round(alter / 1440), "Tag", "Tagen")}`;

  $("ergebnis").innerHTML =
    `<div class="karte" style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
       <span class="hinweis">Letzter Abgleich ${wann}
         (${escape(stand.namen?.a ?? "?")} gegen ${escape(stand.namen?.b ?? "?")})</span>
       <div style="flex:1"></div>
       <button type="button" class="mini" id="vergessen">Verlauf löschen</button>
     </div>`;
  const zuvor = document.createElement("div");
  $("ergebnis").append(zuvor);
  try {
    stand.bericht.gemerkteEinzelheiten = stand.einzelheiten;
    zeigeBericht(stand.bericht, stand.datensatz, stand.schluessel, zuvor);
    zeigeGemerkteEinzelheiten(stand.einzelheiten, zuvor);
  } catch (fehler) {
    console.error("gemerkter Bericht:", fehler);
    zuvor.innerHTML = `<div class="karte hinweis">Der gemerkte Bericht ließ sich nicht anzeigen
      (${escape(String(fehler.message ?? fehler))}). Ein neuer Abgleich hilft.</div>`;
  }
}

document.addEventListener("click", async ev => {
  const s = ev.target?.dataset?.freigeben;
  if (s) {
    const verweis = await verweisHolen(s);
    if (verweis && (await verweis.requestPermission({ mode: "read" })) === "granted") {
      await uebernehmen(s, await verweis.getFile());
    }
  }
  if (ev.target?.id === "vergessen") vergessen();
});

ablageEinrichten("a");
ablageEinrichten("b");
$("starten").disabled = true;

// Ein Knopf, zwei Wege: Wo der Systemdialog zur Verfügung steht, wird er
// genommen — nur er liefert einen Verweis, den der Browser über einen
// Neustart hinweg behalten darf. Sonst die gewöhnliche Dateiauswahl. Für den
// Benutzer ist das derselbe Knopf; der Unterschied ist unsere Sache.
const dialogMoeglich = typeof window.showOpenFilePicker === "function";
for (const knopf of document.querySelectorAll("[data-waehlen]")) {
  const seite = knopf.dataset.waehlen;
  knopf.addEventListener("click", () => {
    if (dialogMoeglich) ueberDialog(seite);
    else $("datei-" + seite).click();
  });
}

wiederherstellen();
</script>
</body>
</html>
